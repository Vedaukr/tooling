# Generated by migrate.py from templates/module.yml — do not edit by hand.
# Component: {{name}}  (path: {{path}})

{{name}}:build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore {{path}}/{{project}}
    - dotnet build {{path}}/{{project}} -c Release --no-restore
    - dotnet test {{path}} -c Release --no-build --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-{{name}}.xml"
  artifacts:
    reports:
      junit: test-{{name}}.xml
  rules:
    - changes:
        - {{path}}/**/*
        - Directory.Build.props
        - Directory.Packages.props

{{name}}:pack:
  stage: package
  needs: ["{{name}}:build"]
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet pack {{path}}/{{project}} -c Release -o $CI_PROJECT_DIR/nupkg -p:PackageId={{package_id}}
    - dotnet nuget push "$CI_PROJECT_DIR/nupkg/*.nupkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - {{path}}/**/*
