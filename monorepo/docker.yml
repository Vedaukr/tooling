# Generated by migrate.py from templates/docker.yml — do not edit by hand.
# Component: {{name}}  (path: {{path}})

{{name}}:build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore {{path}}/{{project}}
    - dotnet build {{path}}/{{project}} -c Release --no-restore
    - dotnet test {{path}} -c Release --no-build --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-{{name}}.xml"
  artifacts:
    reports:
      junit: test-{{name}}.xml
  rules:
    - changes:
        - {{path}}/**/*
        - Directory.Build.props
        - Directory.Packages.props

{{name}}:image:
  stage: package
  needs: ["{{name}}:build"]
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker build -f {{path}}/{{dockerfile}} -t $CI_REGISTRY_IMAGE/{{image}}:$CI_COMMIT_SHORT_SHA {{path}}
    - docker push $CI_REGISTRY_IMAGE/{{image}}:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - {{path}}/**/*
